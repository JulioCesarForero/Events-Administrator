# Backend + PostgreSQL + Nginx (API bajo /api para alinear con Postman y Swagger en el mismo prefijo).
# Rutas en este archivo son relativas a ESTA carpeta (backend-api/docker/).
#
# Desde la raíz del monorepo:
#   docker compose -f backend-api/docker/compose.backend.yml --env-file .env up --build
#
# Swagger: http://localhost:${NGINX_PORT:-80}/api/docs
# API directa (sin prefijo /api): http://localhost:${BACKEND_PORT:-8000}/docs

name: events-backend-local

services:
  db:
    image: postgres:16-alpine
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - events_backend_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - events_net

  backend:
    build:
      context: ../..
      dockerfile: docker/backend.Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ISSUER: ${JWT_ISSUER:-events-administrator}
      DEBUG: "${DEBUG:-true}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Obligatorio si entras por Nginx en /api/* (Try it out en Swagger y OpenAPI correctos).
      ROOT_PATH: "${ROOT_PATH:-/api}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - events_net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - events_net

volumes:
  events_backend_pgdata:

networks:
  events_net:
