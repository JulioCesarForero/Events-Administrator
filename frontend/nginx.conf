events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # gzip básico para el bundle estático.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Assets con hash en el nombre (Vite) -> cache agresiva e inmutable.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html nunca se cachea: es el punto de entrada que enlaza
        # a los bundles versionados de /assets/.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Fallback SPA: cualquier ruta desconocida (por ejemplo /staff/login,
        # /portal, /portal/:eventId/...) debe devolver index.html para que
        # React Router resuelva la ruta en el cliente. Sin esto, recargar
        # una ruta profunda o entrar por URL directa produce 404.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
