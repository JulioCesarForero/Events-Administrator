events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Docker's embedded DNS resolver. Usar resolución en tiempo de petición
    # evita que Nginx falle al arrancar cuando un servicio opcional (por
    # ejemplo `frontend`) todavía no está levantado, compose por compose.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # /api/* -> backend FastAPI
        location /api/ {
            set $backend_upstream "backend:8000";
            proxy_pass http://$backend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api;
        }

        # SPA estático. Cuando el servicio `frontend` está activo (ver
        # compose.local.yml), Nginx hace proxy hacia él. Si no, responde 502
        # en rutas distintas a /api sin impedir que el backend funcione.
        location / {
            set $frontend_upstream "frontend:80";
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;
            error_page 502 503 504 = @no_frontend;
        }

        # Mensaje explícito cuando el servicio `frontend` no está levantado
        # (útil en la compose solo-backend `backend-api/docker/compose.backend.yml`).
        location @no_frontend {
            default_type text/plain;
            return 503 "Frontend service is not running in this compose stack. Enable the `frontend` service in docker/compose.local.yml or use the /api/ routes directly.\n";
        }
    }
}
